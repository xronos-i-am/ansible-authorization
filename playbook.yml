---

- name: configure authorization
  hosts: 127.0.0.1
  connection: local
  become: yes

  vars:
    codename: "{{ansible_facts['distribution_release']}}"
    ubuntu_version: "{{ansible_facts['distribution_version']}}"
    user_path: "~{{user}}"
    home_path: "{{user_path | expanduser}}"

  vars_prompt:
    - name: user
      prompt: "Set user"
      default: "dev" 
      private: no
    # - name: keepass_psw
    #   prompt: "Enter keepass DB password"
    #   private: no
    # - name: keepass_dbx
    #   prompt: "Enter path to keepass DB"
    #   default: "/home/dev/Downloads/xronosiam.kdbx"
    #   private: no

  tasks:
    - debug: msg="Ubuntu {{ubuntu_version}} {{codename}}"
    - debug: msg="Username {{user}}"

  roles:
    ##- { role: ssh_agent }
    ## - { role: yandex_disk }
    # - { role: mailru_disk }
    ## - { role: rclone }
