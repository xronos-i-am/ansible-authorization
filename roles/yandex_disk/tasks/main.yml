- set_fact:
    config_path: "{{home_path}}/.config/yandex-disk"
    default_mount_point: "{{home_path}}/.yandex-disk"
  
- set_fact:
    token_path: "{{ config_path }}/passwd"

- name: Make dir
  file:
    path: "{{ config_path }}"
    state: "directory"
    owner: "{{ user }}"
    group: "{{ user }}"

# https://yandex.com/support/disk/cli-clients.xml#cli-install
- name: Key
  get_url:
    url: "https://repo.yandex.ru/yandex-disk/YANDEX-DISK-KEY.GPG"
    dest: "/etc/apt/keyrings/yandex-disk.asc"
    mode: '0644'

- name: Repo
  deb822_repository:
    name: "yandex-disk"
    types: [deb]
    uris: "https://repo.yandex.ru/yandex-disk/deb/"
    signed_by: /etc/apt/keyrings/yandex-disk.asc
    architectures: [amd64]
    suites: [stable]
    components: [main]

- name: apt-get install yandex-disk
  apt: name=yandex-disk update_cache=yes

- name: check config
  file:
    path: "{{ config_path }}/config.cfg"
    state: file
  failed_when: false
  register: check_yd_config

- name: ask mount point
  pause:
    prompt: "YD mount point"
  register: mount_point
  changed_when: false
  when: check_yd_config.state == 'absent'

- name: config
  template:
    src: config.cfg.j2
    dest: "{{ config_path }}/config.cfg"
    backup: true
  become: true
  become_user: "{{ user }}"
  when: check_yd_config.state == 'absent'

