- name: Check token exists
  file:
    path: "{{ token_path }}"
    state: file
  failed_when: false
  register: check_yd_token

- debug: msg="yandex-disk token {{ token_path }}"
  when: check_yd_token.state == 'absent'


- debug: msg="yandex-disk start"
  when: check_yd_token.state == 'absent'

